<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="'Segoe UI', 'Segoe UI Variable', -apple-system, sans-serif">
  <defs>
    <filter id="menuShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="winClip">
      <rect x="0" y="0" width="720" height="480" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <!-- ventana del Explorador de Windows -->
  <g clip-path="url(#winClip)">
    <rect x="0" y="0" width="720" height="480" fill="#f3f3f3"/>

    <!-- barra de título -->
    <rect x="0" y="0" width="720" height="40" fill="#ffffff"/>
    <rect x="0" y="40" width="720" height="1" fill="#e1e1e1"/>
    <rect x="16" y="14" width="14" height="12" rx="2" fill="#ffcf5c"/>
    <rect x="36" y="17" width="90" height="6" rx="3" fill="#dcdcdc"/>
    <g stroke="#8a8a8a" stroke-width="1.3" fill="none">
      <line x1="642" y1="20" x2="654" y2="20"/>
      <rect x="672" y="14" width="12" height="12"/>
      <line x1="706" y1="14" x2="716" y2="26"/>
      <line x1="716" y1="14" x2="706" y2="26"/>
    </g>

    <!-- barra de direcciones -->
    <rect x="0" y="41" width="720" height="44" fill="#fafafa"/>
    <rect x="0" y="85" width="720" height="1" fill="#e1e1e1"/>
    <g stroke="#8a8a8a" stroke-width="1.3" fill="none" stroke-linecap="round">
      <path d="M18 63 L13 63 M15 60 L11.5 63 L15 66"/>
      <path d="M34 63 L39 63 M37 60 L40.5 63 L37 66"/>
    </g>
    <rect x="90" y="53" width="360" height="24" rx="4" fill="#ffffff" stroke="#d6d6d6"/>
    <rect x="102" y="61" width="14" height="8" rx="2" fill="#c9c9c9"/>
    <rect x="122" y="62" width="60" height="6" rx="3" fill="#dcdcdc"/>
    <rect x="192" y="62" width="90" height="6" rx="3" fill="#dcdcdc"/>

    <!-- panel izquierdo -->
    <rect x="0" y="86" width="150" height="394" fill="#f3f3f3"/>
    <rect x="150" y="86" width="1" height="394" fill="#e1e1e1"/>
    <g>
      <rect x="18" y="103" width="12" height="12" rx="2" fill="#0078D4"/>
      <rect x="38" y="107" width="66" height="6" rx="3" fill="#d6d6d6"/>
      <rect x="18" y="131" width="12" height="12" rx="2" fill="#0aa6e0"/>
      <rect x="38" y="135" width="80" height="6" rx="3" fill="#d6d6d6"/>
      <rect x="18" y="159" width="12" height="12" rx="2" fill="#8a8a8a"/>
      <rect x="38" y="163" width="72" height="6" rx="3" fill="#d6d6d6"/>
      <rect x="18" y="187" width="12" height="12" rx="2" fill="#ffcf5c"/>
      <rect x="38" y="191" width="58" height="6" rx="3" fill="#d6d6d6"/>
      <rect x="18" y="215" width="12" height="12" rx="2" fill="#ffcf5c"/>
      <rect x="38" y="219" width="64" height="6" rx="3" fill="#d6d6d6"/>
    </g>

    <!-- lista de archivos: filas genéricas con marcadores mínimos -->
    <g>
      <!-- carpeta -->
      <rect x="170" y="100" width="16" height="12" rx="1.5" fill="#ffcf5c"/>
      <rect x="196" y="104" width="150" height="6" rx="3" fill="#d9d9d9"/>

      <rect x="170" y="128" width="16" height="12" rx="1.5" fill="#ffcf5c"/>
      <rect x="196" y="132" width="190" height="6" rx="3" fill="#d9d9d9"/>

      <!-- archivo Word seleccionado (relevante: es el que se convierte) -->
      <rect x="164" y="152" width="360" height="28" rx="4" fill="#e5f0fb" stroke="#cfe4fa"/>
      <rect x="172" y="158" width="16" height="16" rx="2" fill="#185abd"/>
      <rect x="198" y="163" width="170" height="6" rx="3" fill="#8fb8e6"/>

      <!-- archivos irrelevantes: solo bloques de color, sin detalle -->
      <rect x="172" y="190" width="16" height="16" rx="2" fill="#c8c8c8"/>
      <rect x="198" y="195" width="130" height="6" rx="3" fill="#e2e2e2"/>

      <rect x="172" y="222" width="16" height="16" rx="2" fill="#c8c8c8"/>
      <rect x="198" y="227" width="150" height="6" rx="3" fill="#e2e2e2"/>

      <rect x="172" y="254" width="16" height="16" rx="2" fill="#c8c8c8"/>
      <rect x="198" y="259" width="110" height="6" rx="3" fill="#e2e2e2"/>
    </g>
  </g>

  <!-- menú contextual -->
  <g filter="url(#menuShadow)">
    <rect x="300" y="150" width="230" height="288" rx="8" ry="8" fill="#f8f8f8" stroke="#d9d9d9"/>

    <!-- entradas irrelevantes: filas mínimas, solo una barra gris -->
    <g fill="#c6c6c6">
      <rect x="316" y="166" width="120" height="7" rx="3.5"/>
      <rect x="316" y="190" width="150" height="7" rx="3.5"/>
      <rect x="316" y="214" width="90" height="7" rx="3.5"/>
      <rect x="316" y="238" width="130" height="7" rx="3.5"/>
      <rect x="316" y="262" width="170" height="7" rx="3.5"/>
    </g>
    <rect x="308" y="275" width="214" height="1" fill="#e3e3e3"/>

    <!-- entrada de NativeOfficeToPdf: la única relevante, resaltada y con texto real -->
    <rect x="304" y="282" width="222" height="27" rx="4" fill="#e5f0fb"/>
    <rect x="316" y="288" width="15" height="16" rx="1.5" fill="#c42b1c"/>
    <text x="323.5" y="299.5" font-size="7" fill="#ffffff" font-weight="bold" text-anchor="middle">PDF</text>
    <text x="342" y="299" font-size="12" font-weight="600" fill="#0f4c86">Convertir a PDF</text>

    <rect x="308" y="317" width="214" height="1" fill="#e3e3e3"/>
    <g fill="#c6c6c6">
      <rect x="316" y="330" width="100" height="7" rx="3.5"/>
      <rect x="316" y="354" width="180" height="7" rx="3.5"/>
      <rect x="316" y="378" width="80" height="7" rx="3.5"/>
    </g>
    <rect x="308" y="391" width="214" height="1" fill="#e3e3e3"/>
    <g fill="#c6c6c6">
      <rect x="316" y="404" width="110" height="7" rx="3.5"/>
      <rect x="316" y="428" width="90" height="7" rx="3.5"/>
    </g>
  </g>
</svg>
